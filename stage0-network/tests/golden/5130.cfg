#
 sysname sw-core
#
 dhcp enable
#
vlan 1
 description quarantine - no SVI, no route
#
vlan 10
 name mgmt
 description Infrastructure: switch, netcore, runner, iDRAC, PVE host
#
vlan 20
 name servers
 description Server workloads: Kubernetes nodes, nas LXC, LB VIPs
#
vlan 40
 name clients
 description PC, laptops, phones, TV, APs - everything behind the living-room switch
#
vlan 99
 name transit
 description Transit only: OPNsense .1 <-> switch .2. No hosts.
#
acl advanced 3020
 description east-west policy for VLAN 20 (servers) - rendered, do not edit
 rule 5 permit udp destination-port eq bootps
 rule 5 comment DHCP relay to OPNsense
 rule 10 permit tcp destination 10.100.10.41 0 destination-port eq 8006
 rule 10 comment Proxmox API - Proxmox CSI, plan 7.4
 rule 20 permit udp destination 10.100.10.10 0 destination-port eq dns
 rule 20 comment PowerDNS - plan 4.6
 rule 30 permit tcp destination 10.100.10.10 0 destination-port eq domain
 rule 30 comment PowerDNS - plan 4.6
 rule 40 permit tcp destination 10.100.10.10 0 destination-port eq 8081
 rule 40 comment PowerDNS API - external-dns, plan 7.3
 rule 50 permit tcp destination 10.100.10.41 0 destination-port eq 9221
 rule 50 comment PVE exporter scrape - plan 7.5
 rule 60 permit tcp destination 10.100.10.40 0 destination-port eq 443
 rule 60 comment iDRAC Redfish scrape - plan 7.5
 rule 70 deny ip destination 10.100.10.0 0.0.0.255
 rule 70 comment servers may not initiate to mgmt
 rule 80 permit tcp destination 10.100.40.0 0.0.0.255 established
 rule 80 comment TCP replies to flows clients started
 rule 90 deny ip destination 10.100.40.0 0.0.0.255
 rule 90 comment servers may not initiate to clients
 rule 1000 permit ip
 rule 1000 comment internet and anything not denied above - OPNsense filters north-south
#
interface Vlan-interface10
 description mgmt - Infrastructure: switch, netcore, runner, iDRAC, PVE host
 ip address 10.100.10.2 255.255.255.0
#
interface Vlan-interface20
 description servers - Server workloads: Kubernetes nodes, nas LXC, LB VIPs
 ip address 10.100.20.2 255.255.255.0
 dhcp select relay
 dhcp relay server-address 10.100.99.1
 packet-filter 3020 inbound
#
interface Vlan-interface40
 description clients - PC, laptops, phones, TV, APs - everything behind the living-room switch
 ip address 10.100.40.2 255.255.255.0
 dhcp select relay
 dhcp relay server-address 10.100.99.1
#
interface Vlan-interface99
 description transit - Transit only: OPNsense .1 <-> switch .2. No hosts.
 ip address 10.100.99.2 255.255.255.252
#
interface GigabitEthernet1/0/1
 description OPNsense LAN
 port access vlan 99
#
interface GigabitEthernet1/0/2
 description R640 iDRAC
 port access vlan 10
#
interface Ten-GigabitEthernet1/0/49
 description R640 Proxmox
 port link-type trunk
 port trunk permit vlan 10 20 50
 port trunk pvid vlan 10
 undo port trunk permit vlan 1
#
interface Ten-GigabitEthernet1/0/51
 description living-room switch (unmanaged)
 port access vlan 40
#
 ip route-static 0.0.0.0 0 10.100.99.1
#
 ssh server enable
 scp server enable
#
local-user admin class manage
 password hash $h$6$PLACEHOLDER
 service-type ssh terminal
 authorization-attribute user-role network-admin
#
line vty 0 63
 authentication-mode scheme
 user-role network-admin
#
return
