[defaults]
inventory = inventory.yml
roles_path = roles
filter_plugins = filter_plugins
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
# community.general.yaml was removed in community.general 12.0; this is its
# built-in replacement, needing no extra collection.
stdout_callback = default
callback_result_format = yaml
display_skipped_hosts = False
# group_vars/ sits next to inventory.yml, which is what makes network.yml load
# for every host. community.sops.sops decrypts group_vars/all/vault.sops.yml,
# which is a symlink into the private homelab-secrets repo (see README).
vars_plugins_enabled = host_group_vars, community.sops.sops

[ssh_connection]
pipelining = True
